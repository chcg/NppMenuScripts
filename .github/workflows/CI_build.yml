name: CI_build

on: [push, pull_request]

jobs:
  build:

    runs-on: windows-latest
    env:
      Projectname: NppMenuScripts
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - msys: UCRT64
            env: ucrt-x86_64
            arch: x86_64
            configuration: Release
            compiler: gcc
          - msys: UCRT64
            env: ucrt-x86_64
            arch: x86_64
            configuration: Debug
            compiler: gcc

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Install and update MSYS2 tools
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msys }}
        install: mingw-w64-${{ matrix.env }}-${{ matrix.compiler }} mingw-w64-${{ matrix.env }}-make
        update: true
        release: true

    - name: Build of plugin dll
      working-directory: .\
      env:
        MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
      run: |
           Write-host "${{ matrix.msys }}"
           Write-host "${{ matrix.configuration }}"
           $Env:MSYSTEM = '${{ matrix.msys }}'
           $tools = Join-Path $Env:MSYS2_ROOT ('${{ matrix.msys }}'.ToLower() + '\bin')
           $usr = Join-Path $Env:MSYS2_ROOT 'usr\bin'
           $Env:Path = $tools + [IO.Path]::PathSeparator + $usr + [IO.Path]::PathSeparator + $Env:Path
           if ( $${{ matrix.configuration == 'Debug'}} ) {$Env:DEBUG = '1'}
           Write-Output "Tools version:"
           Write-Output ((g++ --version | Select-Object -First 1) + " " + (g++ -dumpmachine))
           Write-Output (Get-Command g++).Source
           Write-Output (mingw32-make --version) | select-object -first 1
           Write-Output (sh --version) | select-object -first 1
           .\get-cjson.bat
           if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
           .\build-x64.bat
           if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Package versioned artifact for ${{ matrix.msys }} / ${{ matrix.configuration }}
      id: package
      run: |
           $header = Get-Content src/version.h -Raw
           if ($header -notmatch '(?m)^#define NPP_MENUSCRIPTS_VERSION_MAJOR (\d+)\s*$') { throw 'Could not read the plugin major version.' }
           $major = $Matches[1]
           if ($header -notmatch '(?m)^#define NPP_MENUSCRIPTS_VERSION_MINOR (\d+)\s*$') { throw 'Could not read the plugin minor version.' }
           $minor = $Matches[1]
           if ($header -notmatch '(?m)^#define NPP_MENUSCRIPTS_VERSION_PATCH (\d+)\s*$') { throw 'Could not read the plugin patch version.' }
           $patch = $Matches[1]
           if ($header -notmatch '(?m)^#define NPP_MENUSCRIPTS_VERSION_BUILD (\d+)\s*$') { throw 'Could not read the plugin build version.' }
           $build = $Matches[1]
           $version = "$major.$minor.$patch.$build"
           $zipName = "${{ env.Projectname }}-$version-x64-${{ matrix.configuration }}.zip"
           7z a $zipName .\build\${{ env.Projectname }}.dll
           if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
           "zip_name=$zipName" >> $Env:GITHUB_OUTPUT

    - name: Archive artifacts for Release ${{ matrix.arch }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.package.outputs.zip_name }}
        path: ${{ steps.package.outputs.zip_name }}
